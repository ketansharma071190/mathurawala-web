async function open(pw){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(S),iterations:250000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(I)},key,b(C));return new TextDecoder().decode(pt);}
async function go(pw,remember){try{const html=await open(pw);if(remember){try{localStorage.setItem('mw_pw',pw)}catch(e){}}
document.open();document.write(html);document.close();}catch(e){document.getElementById('m').textContent='That password did not work.';try{localStorage.removeItem('mw_pw')}catch(_){}}}
